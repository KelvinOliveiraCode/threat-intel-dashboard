[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelhub"
version = "1.0.0"
description = "Cruzamento de inventario de equipamentos com base local de CVEs e relatorio de exposicao priorizada"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "threat-intel",
    "cve",
    "vulnerabilidades",
    "inventario",
    "priorizacao",
    "cvss",
    "seguranca-da-informacao",
    "grc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Zero dependencia de runtime. O cruzamento e a comparacao de versao sao
# aritmetica sobre dados locais; trazer um framework para resolver isso
# custaria instalacao para todo mundo e nao tornaria o problema mais facil.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
intelhub = "intelhub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["intelhub"]

[tool.coverage.report]
show_missing = true
# O padrao do portfolio e 70%. O projeto real esta em 96%; o piso fica aqui
# para que uma regressao derrube o build em vez de passar despercebida.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "if TYPE_CHECKING:",
]
